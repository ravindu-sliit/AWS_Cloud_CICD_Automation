  # =============================================================================
  # CI/CD PIPELINE - GitHub Actions
  # =============================================================================
  # This workflow runs automatically when code is pushed to main branch.
  # It tests the code, and if tests pass, deploys to AWS EC2.
  # =============================================================================

  name: CI/CD Pipeline

  # When to run this workflow
  on:
    push:
      branches: [main]
    pull_request:
      branches: [main]

  jobs:
    # ---------------------------------------------------------------------------
    # JOB 1: TEST
    # ---------------------------------------------------------------------------
    test:
      name: Run Tests
      runs-on: ubuntu-latest

      steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Setup Python
          uses: actions/setup-python@v5
          with:
            python-version: '3.13'

        - name: Install dependencies
          run: |
            python -m pip install --upgrade pip
            pip install -r requirements.txt
            pip install pytest httpx

        - name: Run tests
          run: pytest -v

    # ---------------------------------------------------------------------------
    # JOB 2: DEPLOY
    # ---------------------------------------------------------------------------
    deploy:
      name: Deploy to EC2
      runs-on: ubuntu-latest
      needs: test
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'

      steps:
        - name: Deploy to EC2
          uses: appleboy/ssh-action@v1.0.3
          with:
            host: ${{ secrets.EC2_HOST }}
            username: ${{ secrets.EC2_USERNAME }}
            key: ${{ secrets.EC2_SSH_KEY }}
            script: |
              cd ~/AWS_Cloud_CICD_Automation
              git pull origin main
              docker build -t assessment-api .
              docker stop assessment-api-container || true
              docker rm assessment-api-container || true
              docker run -d --name assessment-api-container -p 80:8000 assessment-api
              echo "Deployment complete!"
